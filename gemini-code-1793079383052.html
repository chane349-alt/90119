<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒險者猜拳終極大對決</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }
        h1 { font-size: 22px; color: #333; }
        .input-group { margin: 15px 0; text-align: left; }
        label { font-weight: bold; font-size: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover { background-color: #45a049; }
        .hidden { display: none; }
        .status-box {
            background-color: #eef2f5;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .log-box {
            text-align: left;
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 階段 1：輸入玩家資料 -->
    <div id="login-section">
        <h1>⚔️ 冒險者登入</h1>
        <div class="input-group">
            <label for="username">冒險者名字：</label>
            <input type="text" id="username" placeholder="請輸入名字">
        </div>
        <div class="input-group">
            <label for="equipment">選擇裝備：</label>
            <input type="text" id="equipment" placeholder="例如：黃金鍵盤、魔法魔杖">
        </div>
        <button onclick="startGame()">開始冒險</button>
    </div>

    <!-- 階段 2：遊戲進行 -->
    <div id="game-section" class="hidden">
        <h1>✊✋✌️ 剪刀石頭布 大對決</h1>
        <p id="welcome-msg"></p>

        <div class="status-box">
            <p><strong>勝場數：</strong> <span id="player-name">你</span> <span id="player-score">0</span> 勝 | 電腦 <span id="computer-score">0</span> 勝</p>
            <p>目標：先取得 3 勝者獲勝！</p>
        </div>

        <div id="action-buttons">
            <button onclick="playRound('剪刀')">✌️ 剪刀</button>
            <button onclick="playRound('石頭')">✊ 石頭</button>
            <button onclick="playRound('布')">✋ 布</button>
        </div>

        <div class="log-box" id="game-log"></div>

        <button id="restart-btn" class="hidden" onclick="resetGame()">再次挑戰</button>
    </div>
</div>

<script>
    let name = "";
    let equipment = "";
    let playerWins = 0;
    let computerWins = 0;
    let roundNum = 1;
    const options = ["剪刀", "石頭", "布"];

    function startGame() {
        name = document.getElementById("username").value.trim() || "無名勇者";
        equipment = document.getElementById("equipment").value.trim() || "木棒";

        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("game-section").classList.remove("hidden");

        document.getElementById("welcome-msg").innerText = `歡迎【${name}】！裝備【${equipment}】準備迎戰！`;
        document.getElementById("player-name").innerText = name;
        
        logMessage("=== 戰鬥開始 ===");
    }

    function playRound(playerChoice) {
        if (playerWins >= 3 || computerWins >= 3) return;

        // 電腦隨機出拳 (對應 random.choice)
        const computerChoice = options[Math.floor(Math.random() * options.length)];

        logMessage(`--- 第 ${roundNum} 回合 ---`);
        logMessage(`你出了：${playerChoice} | 🤖 電腦出了：${computerChoice}`);

        // 勝負判斷 logic
        if (playerChoice === computerChoice) {
            logMessage("⚖️ 平手！沒有人得分。");
        } else if (
            (playerChoice === "剪刀" && computerChoice === "布") ||
            (playerChoice === "石頭" && computerChoice === "剪刀") ||
            (playerChoice === "布" && computerChoice === "石頭")
        ) {
            playerWins++;
            logMessage("🎉 這回合你贏了！");
        } else {
            computerWins++;
            logMessage("💥 這回合電腦贏了！");
        }

        roundNum++;
        updateScore();
        checkGameOver();
    }

    function updateScore() {
        document.getElementById("player-score").innerText = playerWins;
        document.getElementById("computer-score").innerText = computerWins;
    }

    function checkGameOver() {
        if (playerWins === 3) {
            logMessage(`\n🏆 恭喜【${name}】以 ${playerWins} : ${computerWins} 擊敗電腦！`);
            endGame();
        } else if (computerWins === 3) {
            logMessage(`\n💻 很可惜，電腦以 ${computerWins} : ${playerWins} 獲得最終勝利！`);
            endGame();
        }
    }

    function endGame() {
        document.getElementById("action-buttons").classList.add("hidden");
        document.getElementById("restart-btn").classList.remove("hidden");
    }

    function logMessage(msg) {
        const logBox = document.getElementById("game-log");
        logBox.innerHTML += msg + "<br>";
        logBox.scrollTop = logBox.scrollHeight;
    }

    function resetGame() {
        playerWins = 0;
        computerWins = 0;
        roundNum = 1;
        document.getElementById("game-log").innerHTML = "";
        updateScore();
        document.getElementById("action-buttons").classList.remove("hidden");
        document.getElementById("restart-btn").classList.add("hidden");
        logMessage("=== 重新開始對決 ===");
    }
</script>

</body>
</html>
